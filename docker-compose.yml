services:
  albert-server:
    build: .
    container_name: albert-activation-server
    ports:
      # Secure-by-default: loopback-only host publish. Non-loopback binds are rejected at startup.
      - "${ALBERT_BIND_ADDRESS:-127.0.0.1}:${ALBERT_HTTP_PORT:-18090}:${ALBERT_HTTP_PORT:-18090}"
      - "${ALBERT_BIND_ADDRESS:-127.0.0.1}:${ALBERT_HTTPS_PORT:-18443}:${ALBERT_HTTPS_PORT:-18443}"
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ALBERT_HTTP_PORT=${ALBERT_HTTP_PORT:-18090}
      - ALBERT_HOST=0.0.0.0
      - ALBERT_IN_DOCKER=1
      - ALBERT_BIND_ADDRESS=${ALBERT_BIND_ADDRESS:-127.0.0.1}
      - FAIRPLAY_KEY_PATH=/app/certs/fairplay.key
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:$${ALBERT_HTTP_PORT:-18090}/health || curl -f http://127.0.0.1:18090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - albert-network

  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3
    container_name: albert-mitmproxy
    command: >
      sh -c 'case "${ALBERT_BIND_ADDRESS:-127.0.0.1}" in 127.*|::1|localhost) ;; *) echo "Refusing LAN bind for mitmproxy: the proxy port has no client authentication" >&2; exit 2;; esac; exec mitmweb -s /app/firmware_restore_proxy.py --set block_global=false --web-host 0.0.0.0 --web-port 28080 --set web_password="${MITMPROXY_WEB_PASSWORD:?MITMPROXY_WEB_PASSWORD must be set}" --listen-port 28081'
    ports:
      - "${ALBERT_BIND_ADDRESS:-127.0.0.1}:${MITMPROXY_WEB_PORT:-28080}:28080"
      - "${ALBERT_BIND_ADDRESS:-127.0.0.1}:${MITMPROXY_PORT:-28081}:28081"
    volumes:
      - ./firmware_restore_proxy.py:/app/firmware_restore_proxy.py:ro
      - ./certs:/app/certs:ro
    env_file:
      - path: .env
        required: false
    environment:
      - LOCAL_ALBERT_HOST=albert-server
      - LOCAL_ALBERT_PORT=${ALBERT_HTTP_PORT:-18090}
      - LOCAL_ALBERT_SCHEME=http
      - ALBERT_BIND_ADDRESS=${ALBERT_BIND_ADDRESS:-127.0.0.1}
      - MITMPROXY_WEB_PORT=28080
      - MITMPROXY_PORT=28081
    depends_on:
      albert-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - albert-network

  firmware-server:
    build:
      context: .
      dockerfile: Dockerfile.firmware
    container_name: albert-firmware-server
    ports:
      - "${ALBERT_BIND_ADDRESS:-127.0.0.1}:${FIRMWARE_SERVER_PORT:-18091}:${FIRMWARE_SERVER_PORT:-18091}"
    # Run as the host user that owns ./certs so the 0600 FairPlay key is
    # readable. The image sets USER app, whose uid does not match the host
    # owner, which made the container die with PermissionError. Override in
    # .env when the host uid differs.
    user: "${ALBERT_UID:-1000}:${ALBERT_GID:-1000}"

    volumes:
      - ./certs:/app/certs:ro
      - ./firmware:/app/firmware:ro
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ALBERT_IN_DOCKER=1
      - ALBERT_BIND_ADDRESS=${ALBERT_BIND_ADDRESS:-127.0.0.1}
      - FIRMWARE_SERVER_PORT=${FIRMWARE_SERVER_PORT:-18091}
      - IPSW_DIR=/app/firmware
      - FAIRPLAY_KEY_PATH=/app/certs/fairplay.key
      - FAIRPLAY_CERT_PATH=/app/certs/fairplay.crt
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

    healthcheck:
        # This image ships tini and ca-certificates only, so the curl-based
        # probe the albert-server service uses always failed with "curl: not
        # found" and left the container permanently unhealthy. Python is
        # already present, so probe with it instead of adding a package.
        test:
          - CMD
          - python3
          - -c
          - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('FIRMWARE_SERVER_PORT','18091'), timeout=5)"
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
    networks:
      - albert-network

networks:
  albert-network:
    driver: bridge