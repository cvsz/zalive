services:
  albert-server:
    build: .
    container_name: albert-activation-server
    ports:
      # Secure-by-default: localhost-only host publish. For LAN, override via .env with ALBERT_HOST=0.0.0.0
      - "${ALBERT_HOST:-127.0.0.1}:${ALBERT_HTTP_PORT:-18090}:${ALBERT_HTTP_PORT:-18090}"
      - "${ALBERT_HOST:-127.0.0.1}:${ALBERT_HTTPS_PORT:-18443}:${ALBERT_HTTPS_PORT:-18443}"
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ALBERT_HTTP_PORT=${ALBERT_HTTP_PORT:-18090}
      - FAIRPLAY_KEY_PATH=/app/certs/fairplay.key
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:$${ALBERT_HTTP_PORT:-18090}/health || curl -f http://127.0.0.1:18090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - albert-network

  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3
    container_name: albert-mitmproxy
    command: sh -c "mitmweb -s /app/firmware_restore_proxy.py --set block_global=false --web-host 0.0.0.0 --web-port 28080 --set web_password='${MITMPROXY_WEB_PASSWORD:?MITMPROXY_WEB_PASSWORD must be set}' --listen-port 28081"
    ports:
      - "${ALBERT_HOST:-127.0.0.1}:${MITMPROXY_WEB_PORT:-28080}:28080"
      - "${ALBERT_HOST:-127.0.0.1}:${MITMPROXY_PORT:-28081}:28081"
    volumes:
      - ./firmware_restore_proxy.py:/app/firmware_restore_proxy.py:ro
    env_file:
      - path: .env
        required: false
    environment:
      - LOCAL_ALBERT_HOST=albert-server
      - LOCAL_ALBERT_PORT=${ALBERT_HTTP_PORT:-18090}
      - LOCAL_ALBERT_SCHEME=http
      - MITMPROXY_WEB_PORT=28080
      - MITMPROXY_PORT=28081
    depends_on:
      albert-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - albert-network

networks:
  albert-network:
    driver: bridge